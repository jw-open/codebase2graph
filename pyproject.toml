[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code2graph"
version = "0.1.0"
description = "Generate OhWise-compatible graph JSON from source code repositories."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "jw-open" }]
keywords = ["code-analysis", "graph", "knowledge-graph", "ohwise"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
code2graph = "code2graph.cli:main"
code2graph-iterate = "code2graph.iterate:main"
code2graph-loop = "code2graph.loop:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
